monitorDwindleOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []

[appearance]
mode = "automatic"

[borders]
enabled = false
width = 1.5

[borders.color]
alpha = 1.0
blue = 0.0
green = 0.9574088454246521
red = 0.8668023943901062

[clipboard]
historyEnabled = false
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 1.1
moveToRootStable = true
singleWindowAspectRatio = "fill"
smartSplit = true
splitWidthMultiplier = 0.5
useGlobalGaps = true

[focus]
followsMouse = false
followsWindowToMonitor = true
moveMouseToFocusedWindow = false

[gaps]
size = 2.0

[gaps.outer]
bottom = 2.0
left = 1.0
right = 1.0
top = 1.0

[general]
animationsEnabled = true
defaultLayoutType = "niri"
hotkeysEnabled = true
hyperKeyHoldThresholdMilliseconds = 150
hyperTrigger = "Left Option"
ipcEnabled = true
preventSleepEnabled = false
updateChecksEnabled = true

[gestures]
fingerCount = 3
invertDirection = true
mouseResizeModifierKey = "option"
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0

[mouseWarp]
axis = "horizontal"
margin = 1
monitorOrder = ["LS27A800U", "Built-in Retina Display"]

[niri]
alwaysCenterSingleColumn = true
centerFocusedColumn = "onOverflow"
columnWidthPresets = [0.66, 0.95, 1.0, 0.3]
defaultColumnWidth = 0.7
infiniteLoop = true
maxVisibleColumns = 1
singleWindowAspectRatio = "none"

[quakeTerminal]
animationDuration = 0.2
autoHide = false
enabled = false
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 1.0
position = "center"
widthPercent = 50.0

[statusBar]
showAppNames = false
showWorkspaceName = true
useWorkspaceId = false

[workspaceBar]
backgroundOpacity = 0.4
deduplicateAppIcons = false
enabled = true
height = 30.0
hideEmptyWorkspaces = true
labelFontSize = 12.0
notchAware = true
position = "overlappingMenuBar"
reserveLayoutSpace = false
showFloatingWindows = true
showLabels = true
windowLevel = "popup"
xOffset = 100.0
yOffset = 0.0

